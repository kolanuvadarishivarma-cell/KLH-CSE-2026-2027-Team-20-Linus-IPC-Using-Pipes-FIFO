<!DOCTYPE html>
<!--
  index.html — THE FRONTEND.
  Knows nothing about pipes, FIFOs, or system calls. It only calls two
  addresses the backend exposes: GET /messages and POST /send. All real
  Linux IPC work lives in ../backend/server.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header>
      <span class="wordmark">Relay</span>
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">Connecting</span>
      </div>
    </header>

    <div id="chat" class="chat">
      <div id="empty" class="empty">
        <p>No messages yet.</p>
        <p class="empty-sub">Say something — it travels through a live pipe to the other window.</p>
      </div>
    </div>

    <form id="messageForm" class="composer">
      <input id="messageBox" autocomplete="off" placeholder="Message" disabled>
      <button id="sendBtn" type="submit" disabled aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="/script.js"></script>
</body>
</html>
